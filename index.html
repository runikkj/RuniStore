<!DOCTYPE html><html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Runi Store BR</title>
    <style>
      /body {
        margin: 0;
        background: #0a0a0a;
        color: #fff;
        font-family: Arial, sans-serif;
    }

    header {
        text-align: center;
        padding: 20px 0;
        background: #b30000;
        border-bottom: 3px solid #ffffff;
    }

    .logo {
        width: 180px;
        margin-bottom: 10px;
    }

    nav a {
        color: #fff;
        text-decoration: none;
        margin: 0 10px;
        font-size: 18px;
    }

    .luzes {
        width: 100%;
        text-align: center;
        font-size: 22px;
        margin: 10px 0;
    }

    .lista-jogos {
        padding: 20px;
    }

    .jogo {
        background: #111;
        border: 2px solid #b30000;
        padding: 10px;
        margin-bottom: 20px;
    }

    .jogo img {
        width: 100%;
        border: 2px solid #fff;
    }

    footer {
        text-align: center;
        padding: 15px;
        background: #b30000;
        border-top: 3px solid #ffffff;
        margin-top: 20px;
    }

    /* EFEITO DE NEVE SIMPLES PARA O PS3 */
    .snowflake {
        position: fixed;
        top: -10px;
        color: white;
        font-size: 18px;
        user-select: none;
        pointer-events: none;
    }
</style>

</head>
<body><header>
    <img src="assets/img/logo-natal.png" class="logo" alt="Runi Store BR">
    <div class="luzes">⭐🎄⭐🎅⭐🎄⭐</div>
    <nav>
        <a href="#">Início</a>
        <a href="#">Jogos PS3</a>
        <a href="#">Contato</a>
    </nav>
</header>
