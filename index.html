<!DOCTYPE html><html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Runi Store BR</title>
    <style>
        /* ESTILO INLINE PARA COMPATIBILIDADE COM O NAVEGADOR DO PS3 */body {
        margin: 0;
        background: #000000;
        color: #fff;
        font-family: Arial, sans-serif;
    }

    header {
        text-align: center;
        padding: 20px 0;
        background: #b30000;
        border-bottom: 3px solid #ffffff;
    }

    .logo {
        width: 180px;
        margin-bottom: 10px;
    }

    nav a {
        color: #fff;
        text-decoration: none;
        margin: 0 10px;
        font-size: 18px;
    }

    .luzes {
        width: 100%;
        text-align: center;
        font-size: 22px;
        margin: 10px 0;
    }

    .lista-jogos {
        padding: 20px;
    }

    .jogo {
        background: #111;
        border: 2px solid #b30000;
        padding: 10px;
        margin-bottom: 20px;
    }

    .jogo img {
        width: 100%;
        border: 2px solid #fff;
    }

    footer {
        text-align: center;
        padding: 15px;
        background: #b30000;
        border-top: 3px solid #ffffff;
        margin-top: 20px;
    }

    /* EFEITO DE NEVE SIMPLES PARA O PS3 */
    .snowflake {
        position: fixed;
        top: -10px;
        color: white;
        font-size: 18px;
        user-select: none;
        pointer-events: none;
    }
</style>

</head>
<body><header>
    <img src="assets/img/logo-natal.png" class="logo" alt="Runi Store BR">
    <div class="luzes">⭐🎄⭐🎅⭐🎄⭐</div>
    <nav>
        <a href="#">Início</a>
        <a href="#">Jogos PS3</a>
        <a href="#">Contato</a>
    </nav>
</header>

<main>

<footer>
    © 2025 Runi Store BR — Tema de Natal
</footer>

<script>
    // NEVE COMPATÍVEL COM O PS3
    function criarNeve() {
        var neve = document.createElement('div');
        neve.className = 'snowflake';
        neve.innerHTML = '❄';
        neve.style.left = Math.random() * window.innerWidth + 'px';
        neve.style.opacity = Math.random();
        neve.style.fontSize = (Math.random() * 10 + 10) + 'px';

        document.body.appendChild(neve);

        var queda = 0;
        var velocidade = 1 + Math.random() * 2;

        var intervalo = setInterval(function() {
            queda += velocidade;
            neve.style.top = queda + 'px';

            if (queda > window.innerHeight) {
                clearInterval(intervalo);
                document.body.removeChild(neve);
            }
        }, 50);
    }

    setInterval(criarNeve, 200);
</script>

</body>
</html>
